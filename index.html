<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Max">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Treino Max</title>
<style>
:root{color-scheme:dark;--bg:#0c0c0e;--panel:#171719;--panel2:#202023;--line:#303035;--orange:#ff7a18;--text:#f6f6f7;--muted:#a4a4ac;--green:#42d392}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));}
button,input,select{font:inherit}button{border:0;cursor:pointer} .app{max-width:720px;margin:auto;padding:18px 16px 24px}
header{display:flex;justify-content:space-between;align-items:center;margin:6px 0 22px}.brand{font-size:23px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--orange)}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}
h1{font-size:28px;line-height:1.1;margin:6px 0 8px;letter-spacing:-.7px}h2{font-size:18px;margin:0 0 14px}p{color:var(--muted);margin:0;line-height:1.45}.section{margin-top:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.hero{background:linear-gradient(140deg,#24201c,#171719 65%);border-color:#4a3020;padding:20px}.btn{background:var(--orange);color:#17110c;border-radius:12px;padding:13px 16px;font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.ghost{background:transparent;color:var(--orange);padding:9px 4px}.btn.danger{color:#ff7777;background:#321d1d}.btn.small{padding:9px 12px;font-size:13px}.row{display:flex;gap:9px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.grow{flex:1;min-width:0}.muted{color:var(--muted)}.orange{color:var(--orange)}.big{font-size:34px;font-weight:900;letter-spacing:-1px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.stat strong{font-size:23px;display:block;margin-bottom:4px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,select{width:100%;min-width:0;background:#101012;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;outline:none}input:focus,select:focus{border-color:var(--orange)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:rgba(17,17,19,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navinner{display:flex;width:100%;max-width:720px;justify-content:space-around}.nav button{color:var(--muted);background:transparent;font-size:11px;padding:6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px}.nav button b{font-size:20px;line-height:20px}.nav button.active{color:var(--orange)}.dayrow{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.day{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:12px;white-space:nowrap}.day.active{background:#3a2417;border-color:var(--orange);color:#ffb77d}.exercise{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.sethead,.setrow{display:grid;grid-template-columns:38px 1fr 1fr 40px;gap:8px;align-items:center}.sethead{font-size:11px;color:var(--muted);padding:10px 0 5px}.setrow{padding:5px 0}.setrow input{padding:10px 6px;text-align:center}.setnum{color:var(--muted);text-align:center}.check{width:36px;height:36px;border-radius:10px;background:#27272b;color:var(--muted);font-size:18px}.check.done{background:#173729;color:var(--green)}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#2b2119;color:#ffb77d;font-size:12px}.empty{text-align:center;padding:26px 12px}.timer{font-size:52px;font-weight:900;text-align:center;letter-spacing:1px;margin:18px 0}.hidden{display:none!important}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;z-index:10;background:#242426;border:1px solid var(--line);padding:13px 16px;border-radius:13px;display:none}.historyitem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.historyitem:last-child{border:0}
@media(min-width:600px){.app{padding:28px 24px}.hero{padding:26px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
<header><div><div class="eyebrow">TEU TREINO. TEU RITMO.</div><div class="brand">TREINO <span>MAX</span></div></div><div class="pill" id="offlineBadge">● Offline pronto</div></header>
<main id="screen"></main>
</div>
<nav class="nav"><div class="navinner">
<button data-tab="home" class="active"><b>⌂</b>Início</button>
<button data-tab="workouts"><b>▤</b>Fichas</button>
<button data-tab="session"><b>⚡</b>Treinar</button>
<button data-tab="history"><b>↗</b>Histórico</button>
<button data-tab="settings"><b>⚙</b>Mais</button>
</div></nav>
<script>
const KEY='treinoMax_v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const starter=[
{id:'a',name:'A — Peito e tríceps',exercises:[
{id:uid(),name:'Supino reto',sets:4,reps:'8–12',rest:90,logs:[]},
{id:uid(),name:'Supino inclinado com halteres',sets:3,reps:'8–12',rest:90,logs:[]},
{id:uid(),name:'Crossover',sets:3,reps:'12–15',rest:60,logs:[]},
{id:uid(),name:'Tríceps na polia',sets:3,reps:'10–15',rest:60,logs:[]}]},
{id:'b',name:'B — Costas e bíceps',exercises:[
{id:uid(),name:'Puxada alta',sets:4,reps:'8–12',rest:90,logs:[]},
{id:uid(),name:'Remada baixa',sets:3,reps:'8–12',rest:90,logs:[]},
{id:uid(),name:'Rosca direta',sets:3,reps:'10–12',rest:60,logs:[]}]},
{id:'c',name:'C — Pernas',exercises:[
{id:uid(),name:'Agachamento no Smith',sets:4,reps:'8–12',rest:120,logs:[]},
{id:uid(),name:'Leg press',sets:4,reps:'10–15',rest:90,logs:[]},
{id:uid(),name:'Mesa flexora',sets:3,reps:'10–15',rest:60,logs:[]}]},
{id:'d',name:'D — Ombros e abdômen',exercises:[
{id:uid(),name:'Desenvolvimento',sets:3,reps:'8–12',rest:90,logs:[]},
{id:uid(),name:'Elevação lateral',sets:3,reps:'12–15',rest:60,logs:[]},
{id:uid(),name:'Abdominal na polia',sets:3,reps:'12–15',rest:45,logs:[]}]},
{id:'e',name:'E — Braços e complementos',exercises:[
{id:uid(),name:'Rosca alternada',sets:3,reps:'10–12',rest:60,logs:[]},
{id:uid(),name:'Tríceps francês',sets:3,reps:'10–12',rest:60,logs:[]}]}
];
let data=load(),tab='home',activeDay=data.workouts[0]?.id||null,session=null,timer=null,timerLeft=0,timerRunning=false;
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.workouts)return d}catch(e){}return {workouts:starter,history:[],lastLoads:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2300)}
function workout(id=activeDay){return data.workouts.find(w=>w.id===id)}
function fmtDate(d){return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){const s=document.getElementById('screen');if(tab==='home')s.innerHTML=home();if(tab==='workouts')s.innerHTML=workoutsPage();if(tab==='session')s.innerHTML=sessionPage();if(tab==='history')s.innerHTML=historyPage();if(tab==='settings')s.innerHTML=settingsPage();bind()}
function home(){let total=data.history.length,last=data.history[0],totalSets=data.history.reduce((a,h)=>a+h.completed,0);return `
<div class="hero card"><div class="eyebrow">BORA TREINAR?</div><h1>Constrói tua<br><span class="orange">evolução.</span></h1><p>Teus treinos organizados, cargas registradas e progresso na palma da mão.</p><div class="row" style="margin-top:20px"><button class="btn grow" data-action="start-default">Iniciar treino →</button><button class="btn secondary" data-action="new-workout">＋ Ficha</button></div></div>
<div class="section"><div class="grid"><div class="stat"><span class="muted">Treinos feitos</span><strong>${total}</strong><span class="muted">sessões registradas</span></div><div class="stat"><span class="muted">Séries concluídas</span><strong>${totalSets}</strong><span class="muted">no histórico</span></div></div></div>
<div class="section"><div class="between"><h2>Minhas fichas</h2><button class="btn ghost" data-tab="workouts">Ver todas →</button></div>${data.workouts.slice(0,5).map(w=>`<div class="card between"><div class="grow"><strong>${esc(w.name)}</strong><p>${w.exercises.length} exercícios</p></div><button class="btn small" data-start="${w.id}">Treinar</button></div>`).join('')||empty('Nenhuma ficha ainda. Cria tua primeira!')}</div>
<div class="section"><h2>Último treino</h2>${last?`<div class="card"><div class="between"><strong>${esc(last.name)}</strong><span class="pill">${fmtDate(last.date)}</span></div><p style="margin-top:8px">${last.completed} séries concluídas · ${last.duration||'—'}</p></div>`:empty('Teu histórico aparece aqui depois do primeiro treino.')}`;
}
function empty(t){return `<div class="card empty"><p>${t}</p></div>`}
function workoutsPage(){return `<div class="eyebrow">ORGANIZAÇÃO</div><div class="between"><h1>Minhas fichas</h1><button class="btn small" data-action="new-workout">＋ Criar</button></div><p>Monte tua divisão e deixa tudo pronto para o próximo treino.</p>${data.workouts.map(w=>`<div class="card"><div class="between"><div class="grow"><h2 style="margin-bottom:5px">${esc(w.name)}</h2><p>${w.exercises.length} exercícios</p></div><button class="btn small" data-start="${w.id}">Treinar</button></div><div style="margin-top:12px">${w.exercises.map(e=>`<div class="between" style="padding:8px 0;border-top:1px solid var(--line)"><div class="grow"><strong>${esc(e.name)}</strong><p>${e.sets} séries · ${esc(e.reps)} reps · ${e.rest}s descanso</p></div><button class="btn ghost" data-edit-ex="${w.id}|${e.id}">Editar</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn secondary small grow" data-add-ex="${w.id}">＋ Exercício</button><button class="btn secondary small" data-rename="${w.id}">Renomear</button><button class="btn danger small" data-delete-workout="${w.id}">Excluir</button></div></div>`).join('')||empty('Cria tua primeira ficha para começar.')}`}
function sessionPage(){if(!session)return `<div class="eyebrow">MODO TREINO</div><h1>Hora de treinar.</h1><p>Escolhe uma ficha e registra cada série conforme avança.</p>${data.workouts.map(w=>`<div class="card between"><div class="grow"><strong>${esc(w.name)}</strong><p>${w.exercises.length} exercícios</p></div><button class="btn" data-start="${w.id}">Começar</button></div>`).join('')}`;let w=workout(session.workoutId);if(!w){session=null;return sessionPage()}let done=session.entries.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0),total=session.entries.reduce((n,e)=>n+e.sets.length,0);return `<div class="between"><div><div class="eyebrow">EM ANDAMENTO</div><h1>${esc(session.name)}</h1></div><button class="btn secondary small" data-action="finish">Finalizar</button></div><div class="card"><div class="between"><span class="muted">Progresso do treino</span><strong class="orange">${done}/${total} séries</strong></div><div style="height:6px;background:#303035;border-radius:9px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${total?done/total*100:0}%;background:var(--orange)"></div></div></div>
<div class="card"><div class="eyebrow">DESCANSO</div><div class="timer" id="timerDisplay">${clock(timerLeft)}</div><div class="row"><button class="btn secondary grow" data-timer="toggle">${timerRunning?'Pausar':'Iniciar'}</button><button class="btn secondary" data-timer="reset">Zerar</button></div><div class="row" style="margin-top:9px">${[30,60,90,120].map(n=>`<button class="btn secondary small grow" data-timer-set="${n}">${n}s</button>`).join('')}</div></div>
${session.entries.map((entry,ei)=>`<div class="exercise"><div class="between"><div class="grow"><h2 style="margin-bottom:5px">${esc(entry.name)}</h2><p>${entry.sets.length} séries previstas · alvo ${esc(entry.reps)}</p></div><span class="pill">${entry.sets.filter(x=>x.done).length}/${entry.sets.length}</span></div><div class="sethead"><span>SÉRIE</span><span>CARGA (kg)</span><span>REPS</span><span>OK</span></div>${entry.sets.map((set,si)=>`<div class="setrow"><span class="setnum">${si+1}</span><input type="number" min="0" step="0.5" placeholder="${data.lastLoads[entry.exerciseId]??'0'}" value="${esc(set.kg)}" data-log="kg|${ei}|${si}" aria-label="Carga em kg"><input type="number" min="0" step="1" placeholder="${entry.reps}" value="${esc(set.reps)}" data-log="reps|${ei}|${si}" aria-label="Repetições"><button class="check ${set.done?'done':''}" data-done="${ei}|${si}">${set.done?'✓':'○'}</button></div>`).join('')}<button class="btn ghost" data-rest="${entry.rest}">⏱ Descansar ${entry.rest}s</button></div>`).join('')}`;
}
function clock(n){return String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')+':'+String(Math.max(0,n)%60).padStart(2,'0')}
function historyPage(){let all=data.history;let best={};all.forEach(h=>h.entries.forEach(e=>e.sets.forEach(s=>{let kg=Number(s.kg)||0;if(kg>(best[e.name]||0))best[e.name]=kg})));return `<div class="eyebrow">CONSISTÊNCIA É TUDO</div><h1>Histórico & evolução</h1><p>Confere tuas sessões e as maiores cargas registradas.</p><div class="section grid"><div class="stat"><span class="muted">Sessões</span><strong>${all.length}</strong></div><div class="stat"><span class="muted">Séries concluídas</span><strong>${all.reduce((a,h)=>a+h.completed,0)}</strong></div></div><div class="section"><h2>Recordes de carga</h2>${Object.keys(best).length?Object.entries(best).sort((a,b)=>b[1]-a[1]).map(([n,k])=>`<div class="historyitem"><span>${esc(n)}</span><strong class="orange">${k} kg</strong></div>`).join(''):empty('Registra teu primeiro treino para acompanhar as cargas.')}</div><div class="section"><h2>Sessões anteriores</h2>${all.length?all.map((h,i)=>`<div class="card"><div class="between"><strong>${esc(h.name)}</strong><span class="pill">${fmtDate(h.date)}</span></div><p style="margin-top:7px">${h.completed} séries concluídas${h.duration?' · '+h.duration:''}</p><details style="margin-top:10px"><summary class="muted">Ver exercícios</summary>${h.entries.map(e=>`<p style="margin-top:8px"><strong>${esc(e.name)}</strong> — ${e.sets.filter(s=>s.done).map(s=>(s.kg||0)+' kg × '+(s.reps||0)).join(', ')||'sem séries concluídas'}</p>`).join('')}</details><button class="btn ghost" data-delete-history="${i}">Excluir registro</button></div>`).join(''):empty('Teus treinos finalizados aparecerão aqui.')}</div>`}
function settingsPage(){return `<div class="eyebrow">PREFERÊNCIAS</div><h1>Mais</h1><div class="card"><h2>Seus dados</h2><p>As fichas e o histórico ficam salvos neste aparelho. Não precisam de conta nem de internet para uso diário.</p><div class="row" style="margin-top:14px"><button class="btn secondary grow" data-action="export">Exportar backup</button><button class="btn secondary grow" data-action="import">Importar backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></div></div><div class="card"><h2>Instalar no iPhone</h2><p>Depois de publicar/abrir o app por um endereço HTTPS no Safari, toque em Compartilhar e escolha “Adicionar à Tela de Início”. Para uso offline confiável, abra uma vez com internet antes de ir à academia.</p></div><div class="card"><h2>Dados locais</h2><p>Não apague os dados do site do Safari se quiser preservar teus treinos. Exporta um backup de vez em quando.</p><button class="btn danger" style="margin-top:14px" data-action="reset">Restaurar app (apaga dados)</button></div><div class="section"><p style="font-size:12px">TREINO MAX · versão inicial</p></div>`}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startSession(b.dataset.start));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-add-ex]').forEach(b=>b.onclick=()=>addExercise(b.dataset.addEx));document.querySelectorAll('[data-edit-ex]').forEach(b=>b.onclick=()=>editExercise(...b.dataset.editEx.split('|')));document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameWorkout(b.dataset.rename));document.querySelectorAll('[data-delete-workout]').forEach(b=>b.onclick=()=>deleteWorkout(b.dataset.deleteWorkout));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>markDone(...b.dataset.done.split('|').map(Number)));document.querySelectorAll('[data-log]').forEach(el=>el.onchange=()=>logValue(el.dataset.log,el.value));document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>timerAction(b.dataset.timer));document.querySelectorAll('[data-timer-set]').forEach(b=>b.onclick=()=>setTimer(Number(b.dataset.timerSet)));document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>setTimer(Number(b.dataset.rest)));document.querySelectorAll('[data-delete-history]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este registro?')){data.history.splice(Number(b.dataset.deleteHistory),1);save();render()}})}
function action(a){if(a==='new-workout'){let name=prompt('Nome da ficha (ex.: A — Peito e tríceps)');if(!name?.trim())return;let w={id:uid(),name:name.trim(),exercises:[]};data.workouts.push(w);activeDay=w.id;save();go('workouts')}if(a==='start-default'){let w=workout(activeDay)||data.workouts[0];if(w)startSession(w.id);else toast('Cria uma ficha primeiro.')}if(a==='finish')finishSession();if(a==='export')exportData();if(a==='import')document.getElementById('importFile').click();if(a==='reset'&&confirm('Isso apaga fichas e histórico deste aparelho. Continuar?')){localStorage.removeItem(KEY);data=load();session=null;save();go('home')}}
function startSession(id){let w=workout(id);if(!w)return toast('Adiciona exercícios à ficha primeiro.');activeDay=id;session={workoutId:id,name:w.name,start:Date.now(),entries:w.exercises.map(e=>({exerciseId:e.id,name:e.name,reps:e.reps,rest:e.rest,sets:Array.from({length:Number(e.sets)||3},()=>({kg:'',reps:'',done:false}))}))};timerLeft=0;timerRunning=false;go('session')}
function markDone(ei,si){let set=session?.entries[ei]?.sets[si];if(!set)return;set.done=!set.done;if(set.done){let kg=Number(set.kg)||0;if(kg) data.lastLoads[session.entries[ei].exerciseId]=kg;save();}render()}
function logValue(key,val){if(!session)return;let [type,ei,si]=key.split('|');let set=session.entries[+ei].sets[+si];set[type]=val;if(type==='kg'&&Number(val)>0)data.lastLoads[session.entries[+ei].exerciseId]=Number(val);save()}
function addExercise(id){let name=prompt('Nome do exercício');if(!name?.trim())return;let sets=Number(prompt('Quantas séries?', '3'))||3;let reps=prompt('Repetições alvo?', '8–12')||'8–12';let rest=Number(prompt('Descanso em segundos?', '90'))||90;workout(id).exercises.push({id:uid(),name:name.trim(),sets,reps,rest,logs:[]});activeDay=id;save();render();toast('Exercício adicionado!')}
function editExercise(wid,eid){let e=workout(wid)?.exercises.find(x=>x.id===eid);if(!e)return;let name=prompt('Nome do exercício',e.name);if(name===null)return;let sets=prompt('Número de séries',e.sets);let reps=prompt('Repetições alvo',e.reps);let rest=prompt('Descanso em segundos',e.rest);if(name.trim())e.name=name.trim();if(Number(sets)>0)e.sets=Number(sets);if(reps)e.reps=reps;if(Number(rest)>=0)e.rest=Number(rest);save();render()}
function renameWorkout(id){let w=workout(id),n=prompt('Nome da ficha',w.name);if(n?.trim()){w.name=n.trim();save();render()}}
function deleteWorkout(id){if(!confirm('Excluir esta ficha e seus exercícios?'))return;data.workouts=data.workouts.filter(w=>w.id!==id);if(activeDay===id)activeDay=data.workouts[0]?.id||null;save();render()}
function setTimer(n){timerLeft=n;timerRunning=false;updateTimer();if(tab!=='session')go('session');else render()}
function timerAction(a){if(a==='reset'){timerRunning=false;timerLeft=0;updateTimer()}else{timerRunning=!timerRunning;if(timerRunning&&!timer){timer=setInterval(()=>{if(timerRunning&&timerLeft>0){timerLeft--;updateTimer();if(timerLeft===0){timerRunning=false;if(navigator.vibrate)navigator.vibrate([250,100,250]);toast('Descanso finalizado! Bora pra próxima série 💪')}}},1000)}updateTimer();let b=document.querySelector('[data-timer="toggle"]');if(b)b.textContent=timerRunning?'Pausar':'Iniciar'}}
function updateTimer(){let el=document.getElementById('timerDisplay');if(el)el.textContent=clock(timerLeft)}
function finishSession(){if(!session)return;let completed=session.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);if(!completed&&!confirm('Nenhuma série foi marcada. Salvar treino mesmo assim?'))return;let mins=Math.max(1,Math.round((Date.now()-session.start)/60000));data.history.unshift({name:session.name,date:Date.now(),completed,duration:mins+' min',entries:session.entries.map(e=>({name:e.name,sets:e.sets.map(s=>({...s}))}))});save();session=null;timerRunning=false;timerLeft=0;go('history');toast('Treino salvo no histórico!')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='treino-max-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exportado.')}
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.workouts||!d.history)throw 0;data=d;save();render();toast('Backup importado!')}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(e.target.files[0])}});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
